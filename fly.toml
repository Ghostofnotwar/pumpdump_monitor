# fly.toml app configuration file generated for pumpdump-monitor on 2026-10-29T09:04:31Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pumpdump-monitor'
primary_region = 'ams'
kill_signal = 'SIGTERM'
kill_timeout = '30s'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  strategy = 'immediate'

[env]
  ALERT_COOLDOWN_SEC = '600'
  ALERT_WINDOW_SEC = '300'
  DATABASE_URL = 'sqlite:////data/bot.db'
  DROP_PENDING_UPDATES = 'false'
  LOG_LEVEL = 'INFO'
  MAX_SYMBOLS = '500'
  POLL_INTERVAL_SEC = '2'
  PORT = '8000'
  SNAPSHOT_DIR = '/data/snapshots'

[[mounts]]
  source = 'pumpdump_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 40
    soft_limit = 20

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
