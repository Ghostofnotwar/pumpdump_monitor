[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
filterwarnings = ["error::ResourceWarning", "ignore:Deprecated since version v22.2:DeprecationWarning"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
